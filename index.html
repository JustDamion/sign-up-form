<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign-Up</title>
</head>

<body>
    <header>
        <div class="header__title">
            <img src="images/odin-lined.png" alt="">
            <h1>ODIN</h1>
        </div>
        <p class="header__credit">Photo by <span class="underline">Halie West</span> on
            <span class="underline">Unsplash</span>
        </p>
    </header>
    <main>
        <p>This is not a real online service! You know you need something like this in your life to help you realize
            your
            deepest dreams. Sign up now to get started</p>
        <p>You know you want to.</p>

        <form action="">
            <div class="form__container form__background--light">
                <h2>Let's do this!</h2>
                <div class="form__input--row">
                    <div class="form__input">
                        <label for="first-name">First Name</label>
                        <input type="text" name="first-name" id="first-name">
                    </div>

                    <div class="form__input">
                        <label for="last-name">Last Name</label>
                        <input type="text" name="last-name" id="last-name">
                    </div>
                </div>

                <div class="form__input--row">
                    <div class="form__input">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </div>

                    <div class="form__input">
                        <label for="phone-number">Phone Number</label>
                        <input type="tel" name="phone-number" id="phone-number">
                    </div>
                </div>

                <div class="form__input--row">
                    <div class="form__input">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password">
                    </div>

                    <div class="form__input">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" name="confirm-password" id="confirm-password">
                    </div>
                </div>
            </div>
            <button type="submit" class="form__button--submit">Create Account</button>
        </form>

        <p>Already have an account? <span>Log in</span></p>
    </main>
</body>

</html>
